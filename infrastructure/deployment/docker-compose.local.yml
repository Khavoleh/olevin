name: olevin

services:
  postgresql:
    image: postgres:18.6
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: olevin
      POSTGRES_PASSWORD: olevin
      POSTGRES_DB: olevin
    networks:
      - olevin
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ../db/create-atlas-db.sql:/docker-entrypoint-initdb.d/create-atlas-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olevin -d olevin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  atlas:
    image: arigaio/atlas:1.3.3
    container_name: atlas
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    working_dir: /db
    command: schema apply --env local --auto-approve
    networks:
      - olevin
    volumes:
      - ../db:/db:ro

  seq:
    image: datalust/seq:2026.1.17182
    container_name: seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    networks:
      - olevin
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  logto:
    image: svhd/logto:1.44.0
    container_name: logto
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://olevin:olevin@postgresql:5432/auth
      ENDPOINT: ${LOGTO_ENDPOINT:-https://localhost:3001}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-https://auth-admin.localhost}
    networks:
      - olevin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3001/api/status'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - olevin
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      seq:
        condition: service_healthy
      logto:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - olevin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  olevin:
    name: olevin

volumes:
  postgresql_data:
    driver: local
  seq_data:
    driver: local
  mailpit_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
