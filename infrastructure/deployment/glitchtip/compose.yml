services:
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    container_name: glitchtip
    restart: unless-stopped
    depends_on:
      postgresql-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://olevin_glitchtip:olevin_glitchtip@postgresql:5432/glitchtip
      VALKEY_URL: ""
      SECRET_KEY: olevin_glitchtip_local_secret_key
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://glitchtip.localhost
      DEFAULT_FROM_EMAIL: glitchtip@olevin.localhost
      EMAIL_URL: smtp://mailpit:1025
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "30"
    networks:
      - olevin
    volumes:
      - glitchtip_data:/code/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  olevin:
    name: olevin

volumes:
  glitchtip_data:
    driver: local
