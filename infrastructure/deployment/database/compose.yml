services:
  postgresql:
    image: postgres:18.6
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: olevin
      POSTGRES_PASSWORD: olevin
      POSTGRES_DB: olevin
    networks:
      - olevin
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olevin -d olevin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgresql-bootstrap:
    image: postgres:18.6
    container_name: postgresql-bootstrap
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGHOST: postgresql
      PGUSER: olevin
      PGPASSWORD: olevin
      PGDATABASE: olevin
      OLEVIN_LOGTO_PASSWORD: olevin_logto
      OLEVIN_ATLAS_PASSWORD: olevin_atlas
      OLEVIN_WOLVERINE_PASSWORD: olevin_wolverine
      OLEVIN_SETTINGS_PASSWORD: olevin_settings
      OLEVIN_FINANCIAL_WELLNESS_PASSWORD: olevin_financial_wellness
      OLEVIN_GLITCHTIP_PASSWORD: olevin_glitchtip
    command:
      ["psql", "--no-psqlrc", "--quiet", "--file", "/bootstrap/bootstrap.sql"]
    networks:
      - olevin
    volumes:
      - ../../db/bootstrap:/bootstrap:ro

  atlas:
    image: arigaio/atlas:1.3.3
    container_name: atlas
    restart: "no"
    depends_on:
      postgresql-bootstrap:
        condition: service_completed_successfully
    working_dir: /db
    command: schema apply --env local --auto-approve
    networks:
      - olevin
    volumes:
      - ../../db:/db:ro

networks:
  olevin:
    name: olevin

volumes:
  postgresql_data:
    driver: local
