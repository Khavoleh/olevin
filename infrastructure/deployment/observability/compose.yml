services:
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: victoria-logs
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=30d"]
    networks:
      - olevin
    volumes:
      - victoria_logs_data:/storage

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.12.0
    container_name: victoria-traces
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=30d"]
    networks:
      - olevin
    volumes:
      - victoria_traces_data:/storage

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    container_name: victoria-metrics
    restart: unless-stopped
    command:
      [
        "-storageDataPath=/storage",
        "-retentionPeriod=30d",
        "-opentelemetry.usePrometheusNaming",
      ]
    networks:
      - olevin
    volumes:
      - victoria_metrics_data:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: otel-collector
    restart: unless-stopped
    depends_on:
      victoria-logs:
        condition: service_started
      victoria-traces:
        condition: service_started
      victoria-metrics:
        condition: service_healthy
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    networks:
      - olevin
    ports:
      - "4318:4318"
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yml:ro

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    depends_on:
      victoria-logs:
        condition: service_started
      victoria-traces:
        condition: service_started
      victoria-metrics:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: https://grafana.localhost
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.32.0
    networks:
      - olevin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  olevin:
    name: olevin

volumes:
  victoria_logs_data:
    driver: local
  victoria_traces_data:
    driver: local
  victoria_metrics_data:
    driver: local
  grafana_data:
    driver: local
