apiVersion: 1

datasources:
  - name: VictoriaLogs
    uid: victoria-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428
    isDefault: true
    jsonData:
      maxLines: 1000
      otelPreset:
        enabled: true
        tracesDatasourceUid: victoria-traces
        detection:
          traceIdField: trace_id
          severity:
            field: severity_number
            valueCase: number
            source: manual

  - name: VictoriaTraces
    uid: victoria-traces
    type: jaeger
    access: proxy
    url: http://victoria-traces:10428/select/jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: victoria-logs
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: 'trace_id:="$${__trace.traceId}"'

  - name: VictoriaMetrics
    uid: victoria-metrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    jsonData:
      timeInterval: 15s
