services:
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    container_name: monitoring-glitchtip
    restart: unless-stopped
    depends_on:
      postgresql-bootstrap:
        condition: service_completed_successfully
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://monitoring_glitchtip:monitoring_glitchtip@postgresql:5432/glitchtip
      VALKEY_URL: ""
      SECRET_KEY: monitoring_glitchtip_local_secret_key
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://glitchtip.localhost:8443
      DEFAULT_FROM_EMAIL: glitchtip@monitoring.localhost
      EMAIL_URL: consolemail://
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "30"
    networks:
      - monitoring
    volumes:
      - glitchtip_data:/code/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  monitoring:
    name: monitoring

volumes:
  glitchtip_data:
    name: monitoring_glitchtip_data
    driver: local
