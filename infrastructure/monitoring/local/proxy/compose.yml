services:
  caddy:
    image: caddy:2.11.4
    container_name: monitoring-caddy
    restart: unless-stopped
    depends_on:
      grafana:
        condition: service_healthy
      glitchtip:
        condition: service_healthy
    networks:
      - monitoring
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  monitoring:
    name: monitoring

volumes:
  caddy_data:
    name: monitoring_caddy_data
    driver: local
  caddy_config:
    name: monitoring_caddy_config
    driver: local
