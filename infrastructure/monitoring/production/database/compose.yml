services:
  postgresql:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: monitoring
    networks:
      monitoring:
        aliases:
          - monitoring-postgresql
    volumes:
      - postgresql_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgresql-bootstrap:
    image: postgres:18.6
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGHOST: postgresql
      PGUSER: monitoring
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: monitoring
      MONITORING_GLITCHTIP_PASSWORD: ${GLITCHTIP_DATABASE_PASSWORD:?}
      MONITORING_GRAFANA_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:?}
    command:
      ["psql", "--no-psqlrc", "--quiet", "--file", "/bootstrap/infrastructure-bootstrap.sql"]
    networks:
      - monitoring
    volumes:
      - ../../shared/bootstrap:/bootstrap:ro

networks:
  monitoring:
    external: true

volumes:
  postgresql_data:
    name: monitoring_postgresql_data
    driver: local
