services:
  postgresql-bootstrap:
    image: postgres:18.6
    restart: "no"
    environment:
      PGHOST: ${POSTGRES_HOST:?}
      PGUSER: monitoring
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      MONITORING_GLITCHTIP_PASSWORD: ${GLITCHTIP_DATABASE_PASSWORD:?}
      MONITORING_GRAFANA_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:?}
    command:
      ["psql", "--no-psqlrc", "--quiet", "--file", "/bootstrap/infrastructure-bootstrap.sql"]
    networks:
      - monitoring
    volumes:
      - ../../shared/bootstrap:/bootstrap:ro

networks:
  monitoring:
    external: true
