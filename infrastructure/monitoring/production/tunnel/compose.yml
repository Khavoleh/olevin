services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  dokploy-network:
    external: true
