services:
  postgresql:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: olevin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: olevin
    networks:
      olevin:
        aliases:
          - olevin-postgresql
    volumes:
      - postgresql_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olevin -d olevin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgresql-bootstrap:
    image: postgres:18.6
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGHOST: postgresql
      PGUSER: olevin
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: olevin
      OLEVIN_LOGTO_PASSWORD: ${LOGTO_DATABASE_PASSWORD:?}
      OLEVIN_ATLAS_PASSWORD: ${ATLAS_DATABASE_PASSWORD:?}
      OLEVIN_WOLVERINE_PASSWORD: ${WOLVERINE_DATABASE_PASSWORD:?}
      OLEVIN_SETTINGS_PASSWORD: ${SETTINGS_DATABASE_PASSWORD:?}
      OLEVIN_FINANCIAL_WELLNESS_PASSWORD: ${FINANCIAL_WELLNESS_DATABASE_PASSWORD:?}
    command:
      ["psql", "--no-psqlrc", "--quiet", "--file", "/bootstrap/bootstrap.sql"]
    networks:
      - olevin
    volumes:
      - ../../shared/bootstrap:/bootstrap:ro

  atlas:
    image: arigaio/atlas:1.3.3
    restart: "no"
    depends_on:
      postgresql-bootstrap:
        condition: service_completed_successfully
    working_dir: /db
    command: schema apply --env production --auto-approve
    environment:
      ATLAS_DATABASE_URL: postgres://olevin_atlas:${ATLAS_DATABASE_PASSWORD:?}@postgresql:5432/olevin?sslmode=disable
      ATLAS_DEV_DATABASE_URL: postgres://olevin_atlas:${ATLAS_DATABASE_PASSWORD:?}@postgresql:5432/atlas?sslmode=disable
    networks:
      - olevin
    volumes:
      - ../../shared:/db:ro

networks:
  olevin:
    external: true

volumes:
  postgresql_data:
    name: olevin_postgresql_data
    driver: local
